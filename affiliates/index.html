<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ava Rose affiliates | Coming soon</title>
<meta name="description" content="The Ava Rose affiliate programme is not open yet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23F7E4E2'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='36' fill='%23A8646B'%3EA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A211B;--soft:#6b5d53;--paper:#FBF6EE;--rose:#C9858B;--deep:#93545B;--blush:#F7E4E2;--line:#E6DACE}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "DM Sans",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 22px}
header{background:var(--blush);padding:64px 0 56px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#efd2d0;right:-140px;top:-160px}
.k{font:italic 500 22px "Cormorant Garamond",serif;color:var(--deep)}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.05;margin:0}
h1{font-size:clamp(38px,6vw,58px);margin:10px 0 16px;position:relative;z-index:1;max-width:14ch}
h2{font-size:34px;margin:0 0 14px}
.lead{max-width:56ch;color:var(--soft);position:relative;z-index:1}
.btn{display:inline-block;background:var(--deep);color:#fff;text-decoration:none;border-radius:99px;padding:14px 28px;font-weight:500;margin-top:18px;position:relative;z-index:1}
section{padding:52px 0;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.card{background:#fffdf9;border:1px solid var(--line);border-radius:22px;padding:20px}
.card b{display:block;font:500 40px "Cormorant Garamond",serif;color:var(--deep)}
ol{padding-left:22px}ol li{margin:8px 0}
ul{padding-left:20px}ul li{margin:6px 0}
.note{background:var(--blush);border-radius:18px;padding:16px 18px;font-size:15px;color:var(--soft)}
footer{padding:36px 0;font-size:14px;color:var(--soft);text-align:center}
a{color:var(--deep)}
</style>
<meta name="robots" content="noindex">
</head>
<body>
<header><div class="wrap">
 <div class="k">Ava Rose affiliate programme</div>
 <h1>Coming soon</h1>
 <p class="lead">The affiliate programme isn't open yet. If you'd like to hear when it opens, send a message to @avarose.digital on Instagram.</p>
 <a class="btn" href="../">Back to the kit</a>
</div></header>
<footer><div class="wrap">&copy; 2026 Ava Rose. @avarose.digital</div></footer>
</body>
</html>
