<!doctype html><meta charset="utf-8"><title>Ava Rose media bridge</title>
<p>Media bridge for scheduling. You can close this tab.</p>
<script>
window.addEventListener('message', async (e) => {
  if (!e.data || e.data.type !== 'ig-get') return;
  const out = [];
  for (const p of e.data.paths) {
    const r = await fetch(p); const buf = await r.arrayBuffer();
    out.push({name: p.split('/').pop(), path: p, type: r.headers.get('content-type') || '', buf});
  }
  e.source.postMessage({type: 'ig-files', id: e.data.id, files: out}, e.origin, out.map(f => f.buf));
});
if (window.opener) window.opener.postMessage({type: 'ig-bridge-ready'}, '*');
</script>
